[project]
name = "reader3"
version = "0.1.0"
description = "Simple EPUB reader web app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "ebooklib>=0.20",
    "fastapi>=0.121.2",
    "jinja2>=3.1.6",
    "uvicorn>=0.38.0",
]

[project.scripts]
reader3-server = "reader3.server:main"
reader3ctl = "reader3.reader3:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

